name: Validate Skill & Architecture

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate Skill, Links & Architecture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate SKILL.md Structure (Node & Python)
        run: |
          node scripts/validate_skill.js
          python3 scripts/validate_skill.py

      - name: Check Markdown Reference Links (Node & Python)
        run: |
          node scripts/check_references.js
          python3 scripts/check_references.py

      - name: Validate Clean Architecture in Reference Example (Node & Python)
        run: |
          node scripts/validate_architecture.js examples/posts/lib
          python3 scripts/validate_architecture.py examples/posts/lib
